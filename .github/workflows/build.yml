name: Build OpenWrt Firmware - P&W R619AC 128M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd wget file libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3

      - name: Download and extract Image Builder
        run: |
          # 使用正确的版本号 23.05.2 和文件扩展名 .tar.xz
          wget -q https://downloads.openwrt.org/releases/23.05.2/targets/ipq40xx/generic/openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64.tar.xz
          # 使用 xz 解压，而不是 zstd
          tar -xvf openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64.tar.xz

      - name: Add third-party feed for PassWall
        run: |
          cd openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64
          # 添加包含 PassWall 预编译包的 feed
          # 注意：feed 的可用性取决于维护者是否提供对应架构的包
          echo 'src/gz passwall https://raw.githubusercontent.com/mrbtmn/openwrt-passwall-build/main/packages/arm_cortex-a7_neon-vfpv4' >> repositories.conf
          cat repositories.conf

      - name: Build firmware
        run: |
          cd openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64

          make image \
            PROFILE=p2w_r619ac-128m \
            PACKAGES="luci-app-adblock luci-app-passwall luci-i18n-adblock-zh-cn luci-i18n-passwall-zh-cn" \
            ROOTFS_PARTSIZE=64

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r619ac-128m-firmware
          path: openwrt-imagebuilder-*/bin/targets/ipq40xx/generic/*.bin
          if-no-files-found: error
