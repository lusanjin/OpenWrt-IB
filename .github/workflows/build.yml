name: Build OpenWrt Firmware - P&W R619AC 128M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd wget file libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3

      - name: Download and extract Image Builder
        run: |
          wget -q https://downloads.openwrt.org/releases/23.05.2/targets/ipq40xx/generic/openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64.tar.xz
          tar -xvf openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64.tar.xz

      - name: Add third-party feed for PassWall
        run: |
          cd openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64
          
          # 使用 PassWall 官方推荐的 SourceForge 二进制源
          # 架构 ipq40xx 对应的是 arm_cortex-a7_neon-vfpv4
          # release 23.05 对应的版本是 23.05
          BASE_URL="https://master.dl.sourceforge.net/project/openwrt-passwall-build/releases/packages-23.05/arm_cortex-a7_neon-vfpv4"

          # 添加 PassWall 的多个子源
          echo "src/gz passwall_luci ${BASE_URL}/passwall_luci" >> repositories.conf
          echo "src/gz passwall_packages ${BASE_URL}/passwall_packages" >> repositories.conf
          echo "src/gz passwall2 ${BASE_URL}/passwall2" >> repositories.conf
          
          echo "----- Current repositories.conf -----"
          cat repositories.conf

      - name: Build firmware
        run: |
          cd openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64

          # 在 PACKAGES 中显式加入 PassWall 和广告过滤插件
          make image \
            PROFILE=p2w_r619ac-128m \
            PACKAGES="luci-app-adblock luci-app-passwall luci-i18n-adblock-zh-cn luci-i18n-passwall-zh-cn" \
            ROOTFS_PARTSIZE=64

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r619ac-128m-firmware
          path: openwrt-imagebuilder-*/bin/targets/ipq40xx/generic/*.bin
          if-no-files-found: error
