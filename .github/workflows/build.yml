name: Build OpenWrt Firmware - P&W R619AC 128M

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd wget file libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync unzip python3

      - name: Download and extract Image Builder
        run: |
          wget -q https://downloads.openwrt.org/releases/23.05.2/targets/ipq40xx/generic/openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64.tar.xz
          tar -xvf openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64.tar.xz

      # 新增：创建自定义注入目录和开机脚本
      - name: Prepare custom files
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-custom-tuning << 'EOF'
          #!/bin/sh
          # 开启软件流表，关闭硬件流表
          uci set firewall.@defaults[0].flow_offloading='1'
          uci set firewall.@defaults[0].flow_offloading_hw='0'
          uci commit firewall

          # 强制锁定 CPU 为 performance 模式并持久化
          echo performance | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
          sed -i '/scaling_governor/d' /etc/rc.local
          sed -i '/exit 0/d' /etc/rc.local
          echo 'echo performance | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor' >> /etc/rc.local
          echo 'exit 0' >> /etc/rc.local
          chmod +x /etc/rc.local

          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-tuning

      - name: Build firmware
        run: |
          cd openwrt-imagebuilder-23.05.2-ipq40xx-generic.Linux-x86_64

          # 加入 FILES="files" 参数，将刚才的脚本打包进固件
          make image \
            PROFILE=p2w_r619ac-128m \
            PACKAGES="luci luci-ssl luci-app-firewall luci-app-opkg luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-opkg-zh-cn" \
            FILES="files" \
            ROOTFS_PARTSIZE=64

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: r619ac-128m-firmware-tuned
          path: openwrt-imagebuilder-*/bin/targets/ipq40xx/generic/*.bin
          if-no-files-found: error
